prompt: |
  Use $ai-concise-doc to compress this incident report without replacing its native
  fields or changing the facts.

  # Impact
  API errors affected 12% of requests for 18 minutes.

  # Root cause
  A stale DNS cache routed traffic to the retired endpoint.

  # Mitigation
  The on-call engineer flushed the cache and restarted two gateway pods.

  # Follow-up
  Bob owns the cache TTL fix due 2026-09-05.
expect:
  contains:
    - "# Impact"
    - "# Root cause"
    - "# Mitigation"
    - "# Follow-up"
    - "12%"
    - "18 minutes"
    - "Bob"
    - "2026-09-05"
  max_cost_usd: 0.10
  max_duration_seconds: 120
